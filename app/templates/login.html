{% extends "base.html" %}
{% block title %}Sign in · A message for you{% endblock %}
{% block main %}
<section class="card login-card" aria-labelledby="page-title">
  <p class="eyebrow">A personal note</p>
  <h1 id="page-title">A message for you</h1>
  <p class="intro">Enter the name and password you were given.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('site.login_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Open my message</button>
  </form>
</section>
{% endblock %}
